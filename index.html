<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>LA PIZZA · Pizzaria em Pinheiros, São Paulo · Delivery</title>
    <meta
      name="description"
      content="Pizza generosa, recheio até a borda e Catupiry original. Frango com Catupiry, calabresa, portuguesa, carne seca e muito mais. Delivery em Pinheiros e região, de terça a domingo."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%230a0a0a'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23f0b12e' stroke-width='2.5'/%3E%3Cpath d='M32 32 L32 14 A18 18 0 1 1 18.5 20.1 Z' fill='%23f0b12e'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        // Desativa zoom por gesto de pinça (pinch-to-zoom) no celular
        document.addEventListener('gesturestart', function (e) {
          e.preventDefault();
        });
        document.addEventListener('gesturechange', function (e) {
          e.preventDefault();
        });
        document.addEventListener('gestureend', function (e) {
          e.preventDefault();
        });
        document.addEventListener(
          'touchstart',
          function (e) {
            if (e.touches && e.touches.length > 1) {
              e.preventDefault();
            }
          },
          { passive: false }
        );
        document.addEventListener(
          'touchmove',
          function (e) {
            if (e.touches && e.touches.length > 1) {
              e.preventDefault();
            }
          },
          { passive: false }
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
